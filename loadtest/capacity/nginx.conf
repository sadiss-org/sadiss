# The capacity instance: a second SADISS server on the production box that load
# tests run against. Installed as
# /etc/nginx/forge-conf/sadiss.org/server/capacity.conf, which the sadiss.org
# server block includes, so virtual phones go through the same TLS and nginx as
# real phones. Each location copies the live one of the same name, with the
# capacity instance's port.

location /capacity/server/ {
	proxy_set_header Connection '';
	keepalive_timeout 10;
	proxy_pass http://127.0.0.1:3006/;
}

location /capacity/ws/ {
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection 'upgrade';
	proxy_set_header Host $host;
	proxy_cache_bypass $http_upgrade;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
	proxy_pass http://localhost:40001;
}
