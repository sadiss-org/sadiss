// Built only as part of the app's Gradle project, which supplies the Android
// Gradle plugin and the SDK versions in variables.gradle.
apply plugin: 'com.android.library'

android {
    namespace = "net.sadiss.playbackservice"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.core:core:$rootProject.ext.androidxCoreVersion"
}
